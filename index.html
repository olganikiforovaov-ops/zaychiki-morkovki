<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Зайчики и морковки: тренировка счета</title>
  <style>
    :root {
      --sky: #bceaf1;
      --grass: #92d050;
      --leaf: #3e9f4f;
      --carrot: #ff8a2a;
      --pink: #ff7ea8;
      --sun: #ffd95c;
      --ink: #23404a;
      --panel: #fff9e8;
      --line: #26566a;
      --soft: rgba(255, 255, 255, 0.7);
      font-family: "Chalkboard SE", "Marker Felt", "Trebuchet MS", "Arial", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 12%, #fff2a6 0 58px, transparent 60px),
        linear-gradient(180deg, var(--sky) 0 58%, #d5f4cc 58% 100%);
    }

    button {
      font: inherit;
    }

    .game {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      padding: clamp(14px, 3vw, 28px);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 54px);
      line-height: 0.96;
      color: #243b53;
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.7);
      letter-spacing: 0;
    }

    .score {
      min-width: 190px;
      display: grid;
      gap: 4px;
      justify-items: end;
      font-weight: 800;
      font-size: clamp(15px, 2.1vw, 21px);
    }

    .stars {
      min-height: 30px;
      font-size: clamp(17px, 2.2vw, 22px);
      letter-spacing: 1px;
      color: #ffb000;
      text-shadow: 0 2px 0 #fff;
    }

    .series-track {
      width: min(190px, 36vw);
      height: 13px;
      border-radius: 999px;
      border: 2px solid rgba(38, 86, 106, 0.35);
      background: rgba(255, 255, 255, 0.72);
      overflow: hidden;
    }

    .series-fill {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff8a2a, #ffd95c, #92d050);
      transition: width 0.28s ease;
    }

    .stage {
      position: relative;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(240px, 360px) minmax(0, 1fr);
      gap: clamp(14px, 3vw, 28px);
      align-items: stretch;
    }

    .rabbit-field,
    .play-panel {
      border: 4px solid rgba(38, 86, 106, 0.2);
      border-radius: 8px;
      background: var(--soft);
      box-shadow: 0 16px 28px rgba(32, 80, 87, 0.16);
      min-width: 0;
    }

    .rabbit-field {
      position: relative;
      min-height: 520px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.2)),
        linear-gradient(180deg, #bceaf1 0 55%, #9adb74 55% 100%);
    }

    .cloud {
      position: absolute;
      top: 24px;
      left: 22px;
      right: 22px;
      min-height: 92px;
      padding: 16px 18px;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 12px;
      border: 3px solid rgba(38, 86, 106, 0.2);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 0 rgba(255, 255, 255, 0.45);
    }

    .target-number {
      width: clamp(64px, 12vw, 86px);
      height: clamp(64px, 12vw, 86px);
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--sun);
      border: 4px solid #ffb545;
      font-size: clamp(38px, 7vw, 56px);
      font-weight: 900;
      color: #773f00;
    }

    .cloud-text {
      margin: 0;
      font-size: clamp(20px, 3.4vw, 30px);
      line-height: 1.08;
      font-weight: 900;
    }

    .garden {
      position: absolute;
      inset: auto 0 0;
      height: 62%;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.18) 25%, transparent 25%) 0 0 / 34px 34px,
        linear-gradient(225deg, rgba(255,255,255,0.16) 25%, transparent 25%) 0 0 / 34px 34px,
        #88ca59;
    }

    .rabbit {
      position: absolute;
      left: 50%;
      bottom: 94px;
      width: min(78%, 265px);
      transform: translateX(-50%);
      filter: drop-shadow(0 10px 8px rgba(42, 92, 61, 0.22));
      transition: transform 0.24s ease;
      z-index: 2;
    }

    .rabbit.hop {
      animation: bunnyHop 0.42s ease-out 1;
    }

    .rabbit.twirl {
      animation: bunnyTwirl 0.7s ease-in-out 1;
    }

    .rabbit.wiggle {
      animation: bunnyWiggle 0.58s ease-in-out 1;
    }

    .rabbit.dance {
      animation: bunnyDance 1.9s ease-in-out 1;
    }

    .rabbit.sad {
      animation: bunnyOops 0.68s ease-in-out 1;
    }

    .happy-mouth,
    .sad-mouth,
    .tear {
      transition: opacity 0.18s ease;
    }

    .sad-mouth,
    .tear {
      opacity: 0;
    }

    .tear {
      transform-box: fill-box;
      transform-origin: center;
    }

    .rabbit.sad .happy-mouth {
      opacity: 0;
    }

    .rabbit.sad .sad-mouth,
    .rabbit.sad .tear {
      opacity: 1;
    }

    .rabbit.sad .tear {
      animation: tearDrop 0.68s ease-in-out 1;
    }

    .carrot-patch {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 18px;
      min-height: 118px;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      align-items: end;
      z-index: 3;
    }

    .carrot {
      position: relative;
      width: 22px;
      height: 42px;
      margin: 0 auto;
      transform-origin: bottom center;
    }

    .carrot::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 12px;
      width: 12px;
      height: 28px;
      border-radius: 45% 45% 60% 60%;
      background: linear-gradient(180deg, #ffa23e, var(--carrot));
      clip-path: polygon(50% 100%, 6% 0, 94% 0);
      box-shadow: inset 0 -7px 0 rgba(196, 80, 16, 0.16);
    }

    .carrot::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 0;
      width: 18px;
      height: 18px;
      background:
        linear-gradient(70deg, transparent 43%, var(--leaf) 44% 58%, transparent 59%),
        linear-gradient(120deg, transparent 40%, #50b95e 41% 58%, transparent 59%),
        linear-gradient(15deg, transparent 38%, #2c8e43 39% 55%, transparent 56%);
    }

    .play-panel {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 16px;
      padding: clamp(14px, 2.6vw, 24px);
      background: rgba(255, 249, 232, 0.92);
    }

    .range-strip {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .range-badge {
      min-height: 58px;
      display: grid;
      place-items: center;
      padding: 8px 10px;
      border: 3px solid rgba(38, 86, 106, 0.22);
      border-radius: 8px;
      background: #fff;
      color: #315161;
      font-size: clamp(17px, 2.4vw, 23px);
      font-weight: 900;
      line-height: 1.08;
      text-align: center;
      box-shadow: 0 5px 0 rgba(35, 64, 74, 0.12);
    }

    .range-badge strong {
      color: #773f00;
      font-size: 1.12em;
    }

    .answer-button,
    .action-button {
      border: 3px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      color: var(--ink);
      box-shadow: 0 5px 0 rgba(35, 64, 74, 0.2);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .answer-button:hover,
    .action-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 0 rgba(35, 64, 74, 0.2);
    }

    .answer-button:active,
    .action-button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(35, 64, 74, 0.2);
    }

    .task {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 3px solid rgba(38, 86, 106, 0.18);
      border-radius: 8px;
      background: #fff;
    }

    .task-title {
      margin: 0;
      font-size: clamp(23px, 3.3vw, 34px);
      font-weight: 900;
      line-height: 1.1;
    }

    .level-note {
      width: fit-content;
      max-width: 100%;
      padding: 6px 10px;
      border-radius: 8px;
      background: #dff5ff;
      color: #1f5d73;
      border: 2px solid #97d2e5;
      font-size: clamp(15px, 2.2vw, 18px);
      font-weight: 900;
      line-height: 1.1;
    }

    .equation {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: clamp(28px, 4.8vw, 48px);
      font-weight: 900;
      color: #243b53;
    }

    .big-number,
    .missing,
    .answer-view {
      min-width: 68px;
      min-height: 64px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #e8f7ff;
      border: 3px solid #8cc7de;
    }

    .missing {
      background: #fff3a3;
      border-color: #e4aa2f;
      color: #925600;
    }

    .sign {
      min-width: 30px;
      text-align: center;
    }

    .answer-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(58px, 1fr));
      gap: 10px;
      align-content: start;
    }

    .answer-button {
      min-height: 78px;
      display: grid;
      place-items: center;
      gap: 3px;
      background: #fff;
      font-size: clamp(24px, 4vw, 34px);
      font-weight: 900;
    }

    .answer-button.correct {
      background: #bdf29d;
      border-color: #3e9f4f;
    }

    .answer-button.try-again {
      background: #ffd2dd;
      border-color: #d34b70;
    }

    .mini-carrots {
      width: 54px;
      min-height: 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1px;
    }

    .mini-carrot {
      width: 4px;
      height: 9px;
      border-radius: 0 0 6px 6px;
      background: var(--carrot);
      clip-path: polygon(50% 100%, 5% 0, 95% 0);
    }

    .feedback {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: clamp(19px, 3vw, 26px);
      font-weight: 900;
    }

    .message {
      min-width: 0;
      line-height: 1.12;
    }

    .action-button {
      min-width: 132px;
      min-height: 54px;
      padding: 8px 14px;
      background: #ff7ea8;
      color: #52162b;
      font-weight: 900;
      border-color: #ad3158;
    }

    .sparkle {
      position: absolute;
      width: 18px;
      height: 18px;
      background: #fff;
      clip-path: polygon(50% 0, 61% 36%, 100% 50%, 61% 64%, 50% 100%, 39% 64%, 0 50%, 39% 36%);
      opacity: 0;
      animation: sparkle 1.1s ease forwards;
      z-index: 5;
    }

    .party-note {
      position: absolute;
      left: 50%;
      top: 42%;
      width: min(82%, 260px);
      min-height: 64px;
      display: grid;
      place-items: center;
      padding: 10px 14px;
      border: 4px solid #bf7317;
      border-radius: 8px;
      background: #fff3a3;
      color: #773f00;
      font-size: clamp(25px, 5vw, 42px);
      font-weight: 900;
      text-align: center;
      transform: translate(-50%, -50%);
      box-shadow: 0 10px 0 rgba(35, 64, 74, 0.16);
      animation: partyNote 2.2s ease forwards;
      z-index: 6;
    }

    @keyframes bunnyHop {
      0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
      45% { transform: translateX(-50%) translateY(-26px) rotate(-3deg); }
      72% { transform: translateX(-50%) translateY(-8px) rotate(2deg); }
    }

    @keyframes bunnyTwirl {
      0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg) scale(1); }
      28% { transform: translateX(-50%) translateY(-18px) rotate(-9deg) scale(1.04); }
      58% { transform: translateX(-50%) translateY(-8px) rotate(8deg) scale(1.02); }
      80% { transform: translateX(-50%) translateY(-16px) rotate(-4deg) scale(1.05); }
    }

    @keyframes bunnyWiggle {
      0%, 100% { transform: translateX(-50%) rotate(0deg); }
      18% { transform: translateX(-55%) rotate(-5deg); }
      36% { transform: translateX(-45%) rotate(5deg); }
      54% { transform: translateX(-53%) rotate(-4deg); }
      72% { transform: translateX(-47%) rotate(4deg); }
    }

    @keyframes bunnyOops {
      0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
      22% { transform: translateX(-58%) translateY(3px) rotate(-4deg); }
      46% { transform: translateX(-44%) translateY(0) rotate(3deg); }
      72% { transform: translateX(-53%) translateY(4px) rotate(-2deg); }
    }

    @keyframes tearDrop {
      0% { transform: translateY(-2px) scale(0.5); opacity: 0; }
      30% { opacity: 1; }
      100% { transform: translateY(10px) scale(1); opacity: 0; }
    }

    @keyframes bunnyDance {
      0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg) scale(1); }
      12% { transform: translateX(-50%) translateY(-24px) rotate(-8deg) scale(1.03); }
      25% { transform: translateX(-50%) translateY(0) rotate(7deg) scale(1); }
      38% { transform: translateX(-50%) translateY(-18px) rotate(8deg) scale(1.04); }
      52% { transform: translateX(-50%) translateY(0) rotate(-7deg) scale(1); }
      66% { transform: translateX(-50%) translateY(-22px) rotate(-5deg) scale(1.05); }
      82% { transform: translateX(-50%) translateY(-6px) rotate(6deg) scale(1.02); }
    }

    @keyframes sparkle {
      0% { transform: scale(0.2) rotate(0deg); opacity: 0; }
      35% { opacity: 1; }
      100% { transform: scale(1.4) rotate(110deg); opacity: 0; }
    }

    @keyframes partyNote {
      0% { opacity: 0; transform: translate(-50%, -40%) scale(0.7); }
      18% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
      72% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -62%) scale(0.92); }
    }

    @media (max-width: 820px) {
      .topbar {
        align-items: flex-start;
      }

      .stage {
        grid-template-columns: 1fr;
      }

      .rabbit-field {
        min-height: 390px;
      }

      .rabbit {
        width: min(58%, 218px);
        bottom: 82px;
      }

      .cloud {
        top: 14px;
        left: 14px;
        right: 14px;
        min-height: 74px;
        padding: 10px;
      }

      .carrot-patch {
        bottom: 12px;
        min-height: 82px;
      }

      .carrot {
        width: 18px;
        height: 36px;
      }

      .carrot::before {
        left: 5px;
        top: 11px;
        width: 10px;
        height: 23px;
      }

      .carrot::after {
        left: 2px;
        width: 16px;
        height: 16px;
      }

    }

    @media (max-width: 560px) {
      .game {
        padding: 10px;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr;
      }

      .score {
        justify-items: start;
        grid-template-columns: auto 1fr;
        align-items: center;
      }

      .range-strip,
      .answer-grid {
        gap: 7px;
      }

      .range-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .range-badge {
        min-height: 44px;
      }

      .answer-grid {
        grid-template-columns: repeat(5, minmax(44px, 1fr));
      }

      .answer-button {
        min-height: 64px;
      }

      .feedback {
        display: grid;
      }

      .action-button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="Игра на счет">
    <header class="topbar">
      <h1>Зайчики и морковки</h1>
      <div class="score" aria-label="Счёт">
        <span>Уровень: <span id="levelName">Разогрев</span></span>
        <span>Серия: <span id="streak">0/10</span></span>
        <span class="series-track" aria-hidden="true"><span class="series-fill" id="seriesFill"></span></span>
        <span>Всего: <span id="totalCorrect">0</span></span>
        <span class="stars" id="stars" aria-hidden="true"></span>
      </div>
    </header>

    <section class="stage">
      <div class="rabbit-field" id="field">
        <div class="cloud">
          <div class="target-number" id="targetBadge">8</div>
          <p class="cloud-text" id="cloudText">Собери столько морковок</p>
        </div>

        <div class="garden"></div>

        <svg class="rabbit" id="rabbit" viewBox="0 0 240 260" role="img" aria-label="Зайчик с корзинкой">
          <defs>
            <linearGradient id="earPink" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#ffb1c7"/>
              <stop offset="1" stop-color="#ff7ea8"/>
            </linearGradient>
          </defs>
          <ellipse cx="82" cy="74" rx="27" ry="68" fill="#fff" stroke="#526b7c" stroke-width="6" transform="rotate(-12 82 74)"/>
          <ellipse cx="152" cy="74" rx="27" ry="68" fill="#fff" stroke="#526b7c" stroke-width="6" transform="rotate(12 152 74)"/>
          <ellipse cx="83" cy="80" rx="13" ry="47" fill="url(#earPink)" transform="rotate(-12 83 80)"/>
          <ellipse cx="151" cy="80" rx="13" ry="47" fill="url(#earPink)" transform="rotate(12 151 80)"/>
          <ellipse cx="120" cy="155" rx="78" ry="82" fill="#fff" stroke="#526b7c" stroke-width="6"/>
          <circle cx="91" cy="139" r="9" fill="#243b53"/>
          <circle cx="149" cy="139" r="9" fill="#243b53"/>
          <circle cx="88" cy="151" r="11" fill="#ffd3df"/>
          <circle cx="152" cy="151" r="11" fill="#ffd3df"/>
          <path d="M119 151 l-9 10 h18 z" fill="#ff7ea8"/>
          <path class="happy-mouth" d="M103 171 q17 18 35 0" fill="none" stroke="#243b53" stroke-width="5" stroke-linecap="round"/>
          <path class="sad-mouth" d="M101 177 q18 -15 38 0" fill="none" stroke="#243b53" stroke-width="5" stroke-linecap="round"/>
          <circle class="tear tear-left" cx="78" cy="157" r="5" fill="#8de0f5"/>
          <circle class="tear tear-right" cx="164" cy="157" r="5" fill="#8de0f5"/>
          <path d="M55 210 q65 36 130 0 l-12 42 h-106 z" fill="#b77a3c" stroke="#6d4727" stroke-width="6" stroke-linejoin="round"/>
          <path d="M65 210 q55 -34 110 0" fill="none" stroke="#6d4727" stroke-width="8" stroke-linecap="round"/>
          <path d="M65 202 q-24 -18 -34 10" fill="none" stroke="#526b7c" stroke-width="12" stroke-linecap="round"/>
          <path d="M175 202 q24 -18 34 10" fill="none" stroke="#526b7c" stroke-width="12" stroke-linecap="round"/>
          <ellipse cx="84" cy="246" rx="25" ry="11" fill="#fff" stroke="#526b7c" stroke-width="6"/>
          <ellipse cx="156" cy="246" rx="25" ry="11" fill="#fff" stroke="#526b7c" stroke-width="6"/>
        </svg>

        <div class="carrot-patch" id="carrotPatch" aria-hidden="true"></div>
      </div>

      <div class="play-panel">
        <div class="range-strip" aria-label="Диапазон тренировки">
          <span class="range-badge">числа <strong>6-20</strong></span>
          <span class="range-badge">чаще <strong>11-17</strong></span>
        </div>

        <div class="task">
          <p class="task-title" id="taskText">У зайчика уже 3. Сколько добавить?</p>
          <div class="level-note" id="levelNote">Разогрев</div>
          <div class="equation" id="equation" aria-label="Пример">
            <span class="big-number" id="knownNumber">3</span>
            <span>+</span>
            <span class="missing" id="missingNumber">?</span>
            <span class="equals">=</span>
            <span class="answer-view" id="answerView">8</span>
          </div>
        </div>

        <div class="answer-grid" id="answerButtons" aria-label="Ответы"></div>

        <div class="feedback" aria-live="polite">
          <span class="message" id="message">Выбери морковку с числом.</span>
          <button class="action-button" id="nextButton" type="button">Новый ход</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const warmupTargets = [6, 7, 8, 9, 10];
    const focusTargets = [11, 12, 13, 14, 15, 16, 17];
    const topTargets = [18, 19, 20];
    const answers = Array.from({ length: 20 }, (_, index) => index + 1);
    const seriesLength = 10;
    const levels = [
      {
        name: "Вразнобой",
        note: "Числа выпадают сами: от 6 до 20.",
        modes: ["addRight", "subtract"]
      },
      {
        name: "Сложнее",
        note: "Больше заданий на числа от 11 до 17.",
        modes: ["addRight", "addLeft", "subtract"]
      },
      {
        name: "Смешанно",
        note: "Плюс и минус идут вперемешку.",
        modes: ["addRight", "addLeft", "subtract", "subtract"]
      },
      {
        name: "Два действия",
        note: "В одном задании есть и минус, и плюс.",
        modes: ["twoStep"]
      }
    ];

    const state = {
      target: 12,
      task: null,
      targetQueue: [],
      lastTarget: null,
      streak: 0,
      totalCorrect: 0,
      locked: false
    };

    const answerButtons = document.querySelector("#answerButtons");
    const targetBadge = document.querySelector("#targetBadge");
    const cloudText = document.querySelector("#cloudText");
    const taskText = document.querySelector("#taskText");
    const levelNote = document.querySelector("#levelNote");
    const equation = document.querySelector("#equation");
    const message = document.querySelector("#message");
    const levelName = document.querySelector("#levelName");
    const streak = document.querySelector("#streak");
    const seriesFill = document.querySelector("#seriesFill");
    const totalCorrect = document.querySelector("#totalCorrect");
    const stars = document.querySelector("#stars");
    const carrotPatch = document.querySelector("#carrotPatch");
    const rabbit = document.querySelector("#rabbit");
    const field = document.querySelector("#field");
    const nextButton = document.querySelector("#nextButton");

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pick(items) {
      return items[randomInt(0, items.length - 1)];
    }

    function shuffle(items) {
      const mixed = [...items];
      for (let index = mixed.length - 1; index > 0; index -= 1) {
        const swapIndex = randomInt(0, index);
        [mixed[index], mixed[swapIndex]] = [mixed[swapIndex], mixed[index]];
      }
      return mixed;
    }

    function refillTargetQueue() {
      state.targetQueue = shuffle([
        ...warmupTargets,
        ...focusTargets,
        ...focusTargets,
        ...topTargets
      ]);
    }

    function pickTarget() {
      if (state.targetQueue.length === 0) refillTargetQueue();

      let target = state.targetQueue.shift();
      if (target === state.lastTarget && state.targetQueue.length > 0) {
        const nextTarget = state.targetQueue.shift();
        state.targetQueue.push(target);
        target = nextTarget;
      }

      state.lastTarget = target;
      return target;
    }

    function currentLevel() {
      if (state.totalCorrect >= 12) return levels[3];
      if (state.totalCorrect >= 8) return levels[2];
      if (state.totalCorrect >= 4) return levels[1];
      return levels[0];
    }

    function makeToken(text, className, id) {
      const span = document.createElement("span");
      span.className = className;
      span.textContent = text;
      if (id) span.id = id;
      return span;
    }

    function renderEquation(parts) {
      equation.innerHTML = "";
      parts.forEach((part) => {
        equation.append(makeToken(part.text, part.className, part.id));
      });
    }

    function makeMiniCarrots(count) {
      const wrap = document.createElement("span");
      wrap.className = "mini-carrots";
      for (let i = 0; i < count; i += 1) {
        const carrot = document.createElement("span");
        carrot.className = "mini-carrot";
        wrap.append(carrot);
      }
      return wrap;
    }

    function renderAnswerButtons() {
      answerButtons.innerHTML = "";
      answers.forEach((answer) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer-button";
        button.dataset.answer = answer;
        button.setAttribute("aria-label", `Ответ ${answer}`);

        const number = document.createElement("span");
        number.textContent = answer;
        button.append(number, makeMiniCarrots(answer));

        button.addEventListener("click", () => checkAnswer(answer, button));
        answerButtons.append(button);
      });
    }

    function renderCarrotPatch(total) {
      carrotPatch.innerHTML = "";
      for (let i = 0; i < total; i += 1) {
        const carrot = document.createElement("span");
        carrot.className = "carrot";
        carrot.style.transform = `rotate(${randomInt(-8, 8)}deg)`;
        carrotPatch.append(carrot);
      }
    }

    function updateStars() {
      const count = Math.min(state.streak, seriesLength);
      stars.textContent = "●".repeat(count) + "○".repeat(seriesLength - count);
      streak.textContent = `${count}/${seriesLength}`;
      seriesFill.style.width = `${(count / seriesLength) * 100}%`;
      totalCorrect.textContent = state.totalCorrect;
      levelName.textContent = currentLevel().name;
    }

    function makeTask() {
      const level = currentLevel();
      const mode = pick(level.modes);
      const target = pickTarget();
      state.target = target;

      if (mode === "addLeft") {
        const known = randomInt(1, target - 1);
        const answer = target - known;
        return {
          answer,
          startCarrots: known,
          correctCarrots: target,
          badge: target,
          cloud: "Собери столько морковок",
          title: `Сколько было сначала, если добавили ${known} и стало ${target}?`,
          hint: "Почти. Попробуй посчитать в голове или на пальцах.",
          success: `${answer} + ${known} = ${target}`,
          parts: [
            { text: "?", className: "missing", id: "missingNumber" },
            { text: "+", className: "sign" },
            { text: known, className: "big-number" },
            { text: "=", className: "sign equals" },
            { text: target, className: "answer-view" }
          ]
        };
      }

      if (mode === "subtract") {
        const away = randomInt(1, target - 1);
        const answer = target - away;
        return {
          answer,
          startCarrots: target,
          correctCarrots: answer,
          badge: target,
          cloud: "Было столько морковок",
          title: `У зайчика было ${target}. Он отдал ${away}. Сколько осталось?`,
          hint: "Почти. Смотри: сколько осталось + сколько отдали = всё число.",
          success: `${target} - ${away} = ${answer}`,
          parts: [
            { text: target, className: "big-number" },
            { text: "-", className: "sign" },
            { text: away, className: "big-number" },
            { text: "=", className: "sign equals" },
            { text: "?", className: "missing", id: "missingNumber" }
          ]
        };
      }

      if (mode === "twoStep") {
        const current = randomInt(1, target - 1);
        const answer = target - current;
        const away = randomInt(1, Math.min(6, 20 - current));
        const start = current + away;
        return {
          answer,
          startCarrots: start,
          correctCarrots: target,
          badge: target,
          cloud: "Верни до этого числа",
          title: `Было ${start}, ${away} отдали. Сколько добавить, чтобы стало ${target}?`,
          hint: "Почти. Сначала убери, потом посмотри, сколько не хватает до числа.",
          success: `${start} - ${away} + ${answer} = ${target}`,
          parts: [
            { text: start, className: "big-number" },
            { text: "-", className: "sign" },
            { text: away, className: "big-number" },
            { text: "+", className: "sign" },
            { text: "?", className: "missing", id: "missingNumber" },
            { text: "=", className: "sign equals" },
            { text: target, className: "answer-view" }
          ]
        };
      }

      const known = randomInt(1, target - 1);
      const answer = target - known;
      return {
        answer,
        startCarrots: known,
        correctCarrots: target,
        badge: target,
        cloud: "Собери столько морковок",
        title: `У зайчика уже ${known}. Сколько добавить до ${target}?`,
        hint: "Почти. Посчитай, сколько нужно добавить.",
        success: `${known} + ${answer} = ${target}`,
        parts: [
          { text: known, className: "big-number" },
          { text: "+", className: "sign" },
          { text: "?", className: "missing", id: "missingNumber" },
          { text: "=", className: "sign equals" },
          { text: target, className: "answer-view" }
        ]
      };
    }

    function newRound() {
      const level = currentLevel();
      state.locked = false;
      state.task = makeTask();

      targetBadge.textContent = state.task.badge;
      cloudText.textContent = state.task.cloud;
      taskText.textContent = state.task.title;
      levelNote.textContent = level.note;
      renderEquation(state.task.parts);
      message.textContent = "Выбери морковку с числом.";
      rabbit.classList.remove("hop", "twirl", "wiggle", "dance", "sad");

      document.querySelectorAll(".answer-button").forEach((button) => {
        button.classList.remove("correct", "try-again");
        button.disabled = false;
      });

      updateStars();
      renderCarrotPatch(state.task.startCarrots);
    }

    function checkAnswer(answer, button) {
      if (state.locked) return;
      const task = state.task;

      if (answer === task.answer) {
        state.locked = true;
        state.streak += 1;
        state.totalCorrect += 1;
        const seriesComplete = state.streak >= seriesLength;
        button.classList.add("correct");
        document.querySelector("#missingNumber").textContent = answer;
        message.textContent = seriesComplete
          ? `Серия ${seriesLength} из ${seriesLength}! Зайчик танцует!`
          : `Верно: ${task.success}`;
        renderCarrotPatch(task.correctCarrots);
        updateStars();
        celebrate(seriesComplete);

        setTimeout(() => {
          if (seriesComplete) state.streak = 0;
          newRound();
        }, seriesComplete ? 2600 : 1250);
        return;
      }

      button.classList.add("try-again");
      message.textContent = task.hint;
      updateStars();
      showOops();
      setTimeout(() => button.classList.remove("try-again"), 650);
    }

    function celebrate(isBig = false) {
      rabbit.classList.remove("hop", "twirl", "wiggle", "dance", "sad");
      void rabbit.offsetWidth;

      if (isBig) {
        rabbit.classList.add("dance");
        setTimeout(() => rabbit.classList.remove("dance"), 2000);
        showPartyNote();
      } else {
        const reaction = pick(["hop", "twirl", "wiggle"]);
        rabbit.classList.add(reaction);
        setTimeout(() => rabbit.classList.remove(reaction), 720);
      }

      for (let i = 0; i < (isBig ? 24 : 8); i += 1) {
        const sparkle = document.createElement("span");
        sparkle.className = "sparkle";
        sparkle.style.left = `${randomInt(22, 78)}%`;
        sparkle.style.top = `${randomInt(16, 58)}%`;
        sparkle.style.background = ["#fff", "#ffd95c", "#ff7ea8", "#8de0f5"][randomInt(0, 3)];
        field.append(sparkle);
        setTimeout(() => sparkle.remove(), 1200);
      }
    }

    function showOops() {
      rabbit.classList.remove("hop", "twirl", "wiggle", "dance", "sad");
      void rabbit.offsetWidth;
      rabbit.classList.add("sad");
      setTimeout(() => rabbit.classList.remove("sad"), 760);
    }

    function showPartyNote() {
      const note = document.createElement("span");
      note.className = "party-note";
      note.textContent = "10 из 10!";
      field.append(note);
      setTimeout(() => note.remove(), 2300);
    }

    nextButton.addEventListener("click", newRound);

    renderAnswerButtons();
    newRound();
  </script>
</body>
</html>
